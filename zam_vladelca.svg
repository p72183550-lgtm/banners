<svg xmlns="http://www.w3.org/2000/svg" width="940" height="177" viewBox="0 0 940 177">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#5d0000"/>
    <stop offset=".48" stop-color="#bd1717"/>
    <stop offset="1" stop-color="#5c0000"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#eeeeee"/>
    <stop offset=".5" stop-color="#650000"/>
    <stop offset="1" stop-color="#d52b2b"/>
  </linearGradient>
  <clipPath id="clip">
    <rect x="1.5" y="1.5" width="937" height="174" rx="35"/>
  </clipPath>
  <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
    <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-opacity=".35"/>
  </filter>
</defs>

<rect x="1.5" y="1.5" width="937" height="174" rx="35" fill="url(#bg)" stroke="url(#edge)" stroke-width="3" filter="url(#shadow)"/>

<g clip-path="url(#clip)" opacity=".18">
  <polygon points="80,-20 190,-20 520,180 410,180" fill="#fff"/>
  <polygon points="380,-20 480,-20 810,180 710,180" fill="#fff"/>
  <polygon points="690,-20 790,-20 1100,180 1000,180" fill="#fff"/>
  <polygon points="-80,100 0,40 220,180 100,180" fill="#fff"/>
</g>

<text x="470" y="105"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="50"
      font-weight="800"
      fill="#fff">ЗАМ.ВЛАДЕЛЬЦА</text>
</svg>